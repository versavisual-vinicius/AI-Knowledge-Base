name: Validate AI Knowledge Base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Validate knowledge base
        run: python3 scripts/validate_knowledge_base.py

      - name: Validate adapters
        run: python3 scripts/validate_adapters.py

      - name: Run behavioral eval smoke test
        run: python3 scripts/run_evals.py --smoke --output /tmp/ai-kb-evals.json

      - name: Check OpenCode plugin syntax
        run: node --check .opencode/plugins/ai-knowledge-base.js

      - name: Build deterministic package
        run: python3 scripts/package_core.py --output /tmp/ai-knowledge-base-core.zip
